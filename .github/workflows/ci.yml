name: ALICE Browser Secure CI
on:
  push: { branches: [main, 'ci/**'] }
  pull_request: { branches: [main] }
jobs:
  test-rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [core-engine, api-gateway]
    steps:
      - uses: actions/checkout@v5
      - name: Create dependency stub
        run: |
          mkdir -p ../ALICE-Browser/src
          cat > ../ALICE-Browser/Cargo.toml << 'TOML'
          [package]
          name = "alice-browser"
          version = "0.1.0"
          edition = "2021"
          [features]
          default = []
          std = []
          TOML
          echo "" > ../ALICE-Browser/src/lib.rs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/${{ matrix.service }}
      - run: cd services/${{ matrix.service }} && cargo check
      - run: cd services/${{ matrix.service }} && cargo clippy -- -D warnings
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      # the lock decides what is installed: a package.json that drifted from package-lock.json fails here
      - run: cd frontend && npm ci
      - run: cd frontend && npm run type-check

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check

  url-crate:
    name: url crate (test + no-raw-open gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # the root crate is std-free and standalone; its tests (and the CheckedUrl
      # compile-fail doctest) run here — the services matrix only `cargo check`s
      # the script enforces a MIN_PASSED floor (fails on 0 = nothing ran)
      - run: bash scripts/url_crate_test.sh
      - run: python3 scripts/no_raw_open_check.py --self-test
      - run: python3 scripts/no_raw_open_check.py src services
