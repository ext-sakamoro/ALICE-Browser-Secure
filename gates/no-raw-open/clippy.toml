# no-raw-open gate — shipped snippet. A consumer that opens a URL must route it
# through `alice_browser_secure::open_with(&opener, &CheckedUrl)`; every way to
# hand a string to the OS as something to launch is disallowed here. Clippy
# resolves paths, so renamed imports (`use open::that as go`), split lines and
# aliased variables (`let p = "..."; Command::new(p)`) are all caught. The one
# legitimate launch lives in the consumer's single opener and carries
# `#[allow(clippy::disallowed_methods, reason = "...")]`.
#
# Merge this list into the consumer's clippy.toml and lint with
# `-D clippy::disallowed_methods`.
disallowed-methods = [
    { path = "std::process::Command::new", reason = "launches a process; open a URL via alice_browser_secure::open_with(&CheckedUrl)" },
    { path = "open::that", reason = "raw opener; use open_with(&CheckedUrl)" },
    { path = "open::that_detached", reason = "raw opener; use open_with(&CheckedUrl)" },
    { path = "open::that_in_background", reason = "raw opener; use open_with(&CheckedUrl)" },
    { path = "open::with", reason = "raw opener; use open_with(&CheckedUrl)" },
    { path = "open::with_detached", reason = "raw opener; use open_with(&CheckedUrl)" },
    { path = "opener::open", reason = "raw opener; use open_with(&CheckedUrl)" },
    { path = "opener::open_browser", reason = "raw opener; use open_with(&CheckedUrl)" },
    { path = "webbrowser::open", reason = "raw opener; use open_with(&CheckedUrl)" },
    { path = "webbrowser::open_browser", reason = "raw opener; use open_with(&CheckedUrl)" },
    { path = "libc::system", reason = "launches a shell; use open_with(&CheckedUrl)" },
    { path = "libc::execv", reason = "launches a process; use open_with(&CheckedUrl)" },
    { path = "libc::execvp", reason = "launches a process; use open_with(&CheckedUrl)" },
    { path = "libc::posix_spawn", reason = "launches a process; use open_with(&CheckedUrl)" },
    { path = "windows_sys::Win32::UI::Shell::ShellExecuteW", reason = "launches via the shell; use open_with(&CheckedUrl)" },
    { path = "windows_sys::Win32::UI::Shell::ShellExecuteA", reason = "launches via the shell; use open_with(&CheckedUrl)" },
    { path = "winapi::um::shellapi::ShellExecuteW", reason = "launches via the shell; use open_with(&CheckedUrl)" },
    { path = "winapi::um::shellapi::ShellExecuteA", reason = "launches via the shell; use open_with(&CheckedUrl)" },
]
