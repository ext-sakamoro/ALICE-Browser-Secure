# Allow-list for the forbid-unsafe side of the no-raw-open gate (shipped; a
# consumer copies this and fills it in). Every one of a consumer's own packages
# must carry `[lints.rust] unsafe_code = "forbid"` in its Cargo.toml (or
# `[lints] workspace = true` with `[workspace.lints.rust] unsafe_code = "forbid"`
# in the workspace root) — the compiler then bans every FFI launcher on every
# target. The only EXCEPTION is a package listed here: the single opener
# wrapper, which is where the one intended launch lives. A listed package is
# trusted by review, so the check does not inspect its source.
#
# This repository (alice-browser-secure) opens nothing, so it carries
# `[lints.rust] unsafe_code = "forbid"` itself and this list is empty.
#
# Example for a consumer:
#   [[allow]]
#   name = "my-app-opener"
#   reason = "the single opener wrapper; performs the one real browser launch"

allow = []
